<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play na Consciência</title>
<script type="module" src="/src/main.ts"></script>
</head>
<body>

<!-- Menu inicial: montado por src/ui/hub.ts -->
<div id="hub-screen"></div>

<!-- ============================================================
     PALCO DA VISUAL NOVEL (src/engine/vn)
============================================================ -->
<div id="stage" style="display:none">
  <div id="scene-frame">
    <div id="background"></div>
    <div id="vignette"></div>
    <div id="characters"></div>

    <div id="hud-top">
      <div id="scene-label"></div>
      <div id="menu-controls">
        <div id="audio-controls">
          <button class="menu-btn" id="mute-btn" title="Silenciar música">♪</button>
          <input type="range" id="volume-slider" min="0" max="100" value="35" title="Volume da música" aria-label="Volume da música">
        </div>
        <button class="menu-btn" id="skip-btn" title="Pular adiante (modo dev)" hidden>›</button>
        <button class="menu-btn" id="restart-btn" title="Recomeçar">↺</button>
      </div>
    </div>

    <div id="violence-indicator" role="status" aria-live="polite">
      <div class="violence-header">
        <span class="violence-dot"></span>
        <span id="violence-text"></span>
      </div>
      <div id="violence-explanation"></div>
    </div>

    <div id="dialog-box" aria-live="polite">
      <div id="speaker-name"></div>
      <div id="dialog-text"></div>
      <div id="continue-indicator" aria-hidden="true">▽</div>
    </div>

    <div id="choices"></div>
  </div>
</div>

<!-- ============================================================
     MODO 2 — CELULAR (src/modes/ponte)
============================================================ -->
<div id="ponte-screen" class="hidden">
  <div class="ponte-layout">
    <header id="ponte-top" class="ponte-top"></header>
    <div class="phone">
      <div id="phone-screen"></div>
    </div>
    <aside id="ponte-side" class="ponte-side" hidden></aside>
  </div>
</div>

<!-- Modo 3 — mesa de trabalho (src/modes/dossie) -->
<div id="dossie-screen" class="hidden"></div>

<!-- Modo 4 — situações do cotidiano (src/modes/espelho) -->
<div id="espelho-screen" class="hidden"></div>

<!-- Transição de cena -->
<div id="scene-transition">
  <div id="scene-transition-text"></div>
</div>

<!-- ============================================================
     TELA DE RESUMO FINAL (src/modes/fragmentos/summary.ts)
============================================================ -->
<div id="summary-screen" class="hidden">
  <div class="summary-header">
    <div class="title-eyebrow">Resumo da Experiência</div>
    <h1 class="title-main" style="font-size: clamp(36px, 6vw, 56px);">Suas escolhas</h1>
    <div class="title-divider"></div>
    <p class="title-sub" id="summary-subtitle" style="margin-bottom: 32px;"></p>
  </div>

  <div class="summary-content" id="summary-content"></div>

  <div class="summary-actions">
    <button class="primary-button" id="summary-next" hidden></button>
    <button class="primary-button" id="summary-restart">Recomeçar</button>
    <button class="secondary-button" onclick="window.print()">Imprimir resumo</button>
    <button class="secondary-button" id="summary-menu">Voltar ao menu</button>
  </div>
</div>

</body>
</html>
